<style>
:root{--bg1:#070a14;--bg2:#10162b;--card:rgba(22,28,52,.78);--line:rgba(140,160,255,.14);--ink:#e8ecf8;--mute:#8f9ab8;--acc:#7c8cff;--acc2:#2fd4c0;--gold:#e6b450;--pos:#46d9a0;--neg:#ff7a90}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(60rem 30rem at 85% -10%,rgba(124,140,255,.20),transparent 60%),radial-gradient(50rem 28rem at -10% 10%,rgba(47,212,192,.12),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
.wrap{max-width:62rem;margin:0 auto;padding:1.5rem 1rem 4rem}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
h1{margin:0;font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--acc) 60%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-size:.8rem;color:var(--mute);display:flex;align-items:center;gap:.45rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--pos);box-shadow:0 0 10px var(--pos)}
.dot.off{background:var(--neg);box-shadow:0 0 10px var(--neg)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:2rem 0 .75rem;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.75rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.tile .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.tile .v{font-size:1.6rem;font-weight:600;margin-top:.3rem;font-variant-numeric:tabular-nums}
.tile .s{font-size:.75rem;color:var(--mute);margin-top:.15rem}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:.75rem}
.pick{position:relative;overflow:hidden}
.pick.best{border-color:rgba(230,180,80,.35)}
.pick.best::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),#c98a2a)}
.pick.lean::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.badge{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.08em;padding:.2rem .5rem;border-radius:999px;background:rgba(230,180,80,.15);color:var(--gold)}
.badge.lean{background:rgba(124,140,255,.15);color:var(--acc)}
.badge.parlay{background:rgba(47,212,192,.15);color:var(--acc2)}
.badge.won{background:rgba(70,217,160,.15);color:var(--pos)}.badge.lost{background:rgba(255,122,144,.15);color:var(--neg)}
.sp{font-size:.72rem;color:var(--mute);margin-left:.4rem}
.pk{font-size:1.25rem;font-weight:700;margin:.55rem 0 .1rem}
.ev{font-size:.82rem;color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:.5rem;margin-top:.8rem;font-size:.85rem}
.row b{font-family:'JetBrains Mono',monospace;font-weight:500}
.bet{margin-top:.8rem;padding:.6rem .7rem;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bet .u{font-size:1.15rem;font-weight:700}
.bet .w{font-size:.8rem;color:var(--pos)}
.meta{font-size:.72rem;color:var(--mute);margin-top:.55rem;line-height:1.5}
.conf{height:5px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:.6rem;overflow:hidden}
.conf i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.legs{margin:.6rem 0 0;padding:0;list-style:none}
.legs li{display:flex;justify-content:space-between;font-size:.85rem;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.empty{color:var(--mute);font-size:.9rem;padding:1.2rem;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.45rem .4rem;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
td.r,th.r{text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.scroll{overflow-x:auto}
.note{font-size:.75rem;color:var(--mute);line-height:1.6;margin-top:2rem}
.started{opacity:.55}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 1rem}
.filters select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:.45rem .6rem;font:inherit;font-size:.82rem}
.chart{width:100%;height:220px}
.chart text{fill:var(--mute);font-size:11px;font-family:Inter,sans-serif}
.tt{position:absolute;pointer-events:none;background:#171d3a;border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;font-size:.75rem;display:none;white-space:nowrap}
.rel{position:relative}
.flag{margin-top:.6rem;padding:.5rem .65rem;border-radius:9px;background:rgba(255,122,144,.12);border:1px solid rgba(255,122,144,.35);color:#ffb3c0;font-size:.78rem;font-weight:600}
.bkg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:.75rem;margin-top:.75rem}
td.r,th.r{white-space:nowrap}

.go{display:inline-flex;align-items:center;gap:.35rem;margin-top:.55rem;padding:.45rem .8rem;border-radius:9px;font-size:.8rem;font-weight:700;text-decoration:none;color:#0b0f1a;background:linear-gradient(90deg,var(--acc2),#6fe3c5)}
.go.alt{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);font-weight:600}
.golist{display:flex;flex-wrap:wrap;gap:.35rem}

.game{display:grid;gap:.5rem}
.gh{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.gt{font-size:.72rem;color:var(--mute)}
.gp{font-size:1.1rem;font-weight:700}
.gp small{font-weight:500;color:var(--mute);font-size:.8rem}
.vb{font-size:.62rem;font-weight:700;letter-spacing:.08em;padding:.18rem .45rem;border-radius:999px}
.vb.value{background:rgba(70,217,160,.15);color:var(--pos)}.vb.fair{background:rgba(124,140,255,.15);color:var(--acc)}
.vb.slight{background:rgba(230,180,80,.13);color:var(--gold)}.vb.over{background:rgba(255,122,144,.13);color:var(--neg)}
.gline{display:flex;justify-content:space-between;font-size:.84rem;gap:.5rem;flex-wrap:wrap}
.gline b{font-family:'JetBrains Mono',monospace;font-weight:500}
.why{margin:0;padding-left:1.1rem;font-size:.8rem;color:#c9d0e6;line-height:1.5}
.inj{font-size:.75rem;color:var(--mute);line-height:1.5}
.inj b{color:var(--neg);font-weight:600}
details summary{cursor:pointer;font-size:.75rem;color:var(--acc);list-style:none}

.gsec{margin-top:1rem;font-size:.8rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.more{margin-top:.6rem;width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.85rem;padding:.6rem;border-radius:10px;cursor:pointer}
.legs .p{color:var(--mute);font-size:.75rem;margin-left:.4rem}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:.4rem;overflow-x:auto;padding:.75rem 0;margin-top:1.5rem;background:linear-gradient(180deg,var(--bg1) 70%,transparent);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;padding:.45rem .9rem;border-radius:999px;cursor:pointer}
.tab .n{display:inline-block;min-width:1.2rem;margin-left:.35rem;padding:0 .35rem;border-radius:999px;background:rgba(255,255,255,.08);font-size:.72rem;color:var(--mute)}
.tab.on{background:linear-gradient(90deg,rgba(124,140,255,.35),rgba(47,212,192,.25));border-color:rgba(124,140,255,.5)}

.sec{margin-top:1.4rem}
.sec h3{display:flex;align-items:center;gap:.6rem;margin:0 0 .7rem;font-size:1.15rem;font-weight:700}
.sec h3 .ic{font-size:1.2rem}
.sec h3 .c{font-size:.75rem;font-weight:500;color:var(--mute)}
.sub{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:.9rem 0 .5rem}

<body><div class="wrap">
<header><div><h1>Jarvis<span class="tonight" id="tonight">Tonight's card</span></h1><div class="status" id="status"><span class="dot"></span><span>Loading…</span></div></div>
<div class="status" id="unit"></div></header>

<div class="card" id="settings" hidden></div>
<div class="tiles" id="tiles"></div>

<nav class="tabs" id="tabs"></nav>
<div id="sections"></div>

<div id="extras" hidden><h2>Recent results</h2>
<div class="card scroll"><table><thead><tr><th>Date</th><th>Pick</th><th>Type</th><th class="r">Odds</th><th class="r">Units</th><th class="r">Result</th></tr></thead><tbody id="recent"></tbody></table></div>

<h2>Bot rules · a sport switches off only after 100+ plays with both ROI and closing-line value negative</h2>
<div class="card scroll"><table><thead><tr><th>Sport</th><th class="r">Plays</th><th class="r">ROI</th><th class="r">CLV</th><th class="r">Status</th></tr></thead><tbody id="rules"></tbody></table></div>

</div>
</div>
<script>
const $=id=>document.getElementById(id);
const money=x=>(x<0?'-$':'$')+Math.abs(x).toFixed(2);
const sgn=x=>(x>0?'+':'')+x.toFixed(2);
const pct=x=>(x>0?'+':'')+(x*100).toFixed(1)+'%';
const when=iso=>{const d=new Date(iso);return d.toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})};
const ago=iso=>{if(!iso)return 'never';const m=Math.round((Date.now()-new Date(iso))/60000);return m<1?'just now':m<60?m+'m ago':Math.round(m/60)+'h ago'};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function tile(l,v,s,cls){const c=el('div','card tile');c.append(el('div','l',l));const vv=el('div','v'+(cls?' '+cls:''),v);c.append(vv);if(s)c.append(el('div','s',s));return c}
function parlayCard(p){
  const c=el('div','card pick');const top=el('div');top.append(el('span','badge parlay',p.label+' PARLAY'));top.append(el('span','sp',p.legs.length+' legs · '+p.book));c.append(top);
  const ul=el('ul','legs');p.legs.forEach(l=>{const li=el('li');li.append(el('span',null,l.pick));li.append(el('b',null,fo(l.odds)));ul.append(li)});c.append(ul);

    const M=el('div','heros');M.append(el('div',null,money(total*s.share)),el('div','herop2',Math.round(s.share*100)+'% of stake'));r.append(L,M);if(s.link)r.append(goBtn(s.link,'Bet'));else r.append(el('span'));ul.append(r)});c.append(ul);
  c.append(el('div','meta','Bet both sides as shown ('+money(total)+' total) and you win about '+money(total*a.profit)+' whoever wins. Place both fast: prices move. Books may limit accounts that do this a lot.'));return c}
const SPORTS=[{id:'nba',name:'NBA',ic:'🏀'},{id:'nhl',name:'NHL',ic:'🏒'},{id:'nfl',name:'NFL & College Football',ic:'🏈'},{id:'ufc',name:'UFC',ic:'🥊'},{id:'tennis',name:'Tennis',ic:'🎾'},{id:'more',name:'More (college hoops, soccer…)',ic:'⭐'}];
function group(s){s=(s||'').toUpperCase();if(s.includes('NBA'))return 'nba';if(s.includes('NHL')||s.includes('HOCKEY'))return 'nhl';if(s.includes('NFL')||s.includes('FOOTBALL'))return 'nfl';if(s.includes('MMA')||s.includes('UFC')||s.includes('BOX'))return 'ufc';if(s.includes('TENNIS')||s.includes('ATP')||s.includes('WTA'))return 'tennis';return 'more'}
let TAB='all';
function render(){const G=window._G;if(!G)return;
  const T=$('tabs');T.replaceChildren();const total=SPORTS.reduce((a,s)=>a+(G[s.id].games.length||(G[s.id].picks.length+G[s.id].parlays.length)),0);
  [{id:'all',name:'All'}].concat(SPORTS.map(s=>({id:s.id,name:s.id==='nfl'?'NFL':s.id==='more'?'More':s.name})),[{id:'builder',name:'Parlay builder'},{id:'boost',name:'Boost checker'},{id:'results',name:'Results'},{id:'how',name:'How it works'}]).forEach(t=>{
    const n=(t.id==='builder'||t.id==='boost'||t.id==='how')?'':t.id==='results'?HIST.filter(r=>r.status!=='open').length:t.id==='all'?total:G[t.id].games.length||(G[t.id].picks.length+G[t.id].parlays.length);
    const b=el('button','tab'+(TAB===t.id?' on':''),t.name);b.append(el('span','n',n));b.onclick=()=>{TAB=t.id;render()};T.append(b)});
  const S=$('sections');S.replaceChildren();
  $('extras').hidden=TAB!=='results';
  if(TAB==='boost'){boostSection(S);return}
  if(TAB==='how'){howSection(S);return}
  if(TAB==='results'){myBetsSection(S);renderResults(S);return}
  if(TAB==='builder'){renderBuilder(S);return}
  if(TAB==='all'){
    S.append(heroCard(G));
    const all=[];SPORTS.forEach(s=>G[s.id].picks.forEach(p=>all.push(p)));
    const best=all.filter(p=>p.tier==='best').sort((a,b)=>(a.started-b.started)||(b.edge-a.edge));
    const lean=all.filter(p=>p.tier!=='best').sort((a,b)=>(a.started-b.started)||(a.start<b.start?-1:1));
    const sec=el('section','sec');const h=el('h3');h.append('Best bets',el('span','c',best.length?best.length+' today, the real record':'none yet today'));sec.append(h);
    if(best.length){const w=el('div','picks');best.forEach(p=>w.append(pickCard(p)));sec.append(w)}else sec.append(el('div','card empty','No best bets yet today. When a book misprices a game, it shows up here first.'));
    S.append(sec);
    if(lean.length){const d=el('details','fold');d.append(el('summary',null,lean.length+' action play'+(lean.length>1?'s':'')+' (0.25u, no real edge)'));const w=el('div','picks');lean.forEach(p=>w.append(pickCard(p)));d.append(w);S.append(d)}
    if((FEED.arbs||[]).length){const as=el('section','sec');const ah=el('h3');ah.append('Arbitrage',el('span','c','both sides at different books, profit either way'));as.append(ah);const w=el('div','picks');FEED.arbs.forEach(a=>w.append(arbCard(a)));as.append(w);S.append(as)}
    if((window._BIG||[]).length){const bs=el('section','sec');const bh=el('h3');bh.append('Safest parlays that pay 4x+',el('span','c','for fun, EV shown honestly'));bs.append(bh);const w=el('div','picks');window._BIG.forEach(p=>w.append(bigParlayCard(p)));bs.append(w);S.append(bs)}
    const gs=el('section','sec');const gh=el('h3');gh.append('Every game, and who the bot likes');gs.append(gh);
    let any=false;SPORTS.forEach(s=>{const gg=G[s.id].games;if(!gg.length)return;any=true;gs.append(el('div','gsec',s.name+', '+gg.length+' game'+(gg.length===1?'':'s')));gameList(gs,gg,s.id==='more'?2:4)});
    if(!any)gs.append(el('div','card empty','No upcoming games priced yet.'));S.append(gs);
    return;
  }
  SPORTS.filter(s=>TAB===s.id).forEach(s=>{const g=G[s.id];const n=g.picks.length+g.parlays.length;
    if(TAB==='all'&&!n)return;
    const sec=el('section','sec');const h=el('h3');h.append(el('span','ic',s.ic),s.name,el('span','c',n?n+' bet'+(n>1?'s':''):''));sec.append(h);
    if(!n&&!g.games.length){sec.append(el('div','card empty','No '+s.name+' games priced right now — the bot checks again soon.'))}
    const best=g.picks.filter(p=>p.tier==='best'),lean=g.picks.filter(p=>p.tier==='lean');
    [['Best bets',best,pickCard],['Action plays (leans): 0.25u, priced about fair, not part of the real record',lean,pickCard],['Parlay',g.parlays,parlayCard]].forEach(([lab,arr,fn])=>{if(!arr.length)return;sec.append(el('div','sub',lab));const w=el('div','picks');arr.forEach(x=>w.append(fn(x)));sec.append(w)});
    if(g.games.length){sec.append(el('div','sub','Every game, and who the bot likes'));gameList(sec,g.games,50)}
    S.append(sec)});
}
async function load(auto){
  $('tonight').textContent=new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
  let f;try{const r=await fetch('picks.json?t='+Date.now(),{cache:'no-store'});f=await r.json()}catch(e){$('status').lastChild.textContent='No picks file yet — the bot will post one after its next scan.';return}
  if(auto&&f.updated===LASTUPD){return}LASTUPD=f.updated;
  const fresh=f.updated&&(Date.now()-new Date(f.updated))<75*60000;
  $('status').firstChild.className='dot'+(fresh?'':' off');
  $('status').lastChild.textContent=(fresh?'Bot online':'Bot offline (PC off?)')+' · updated '+ago(f.updated)+' · last scan '+ago(f.last_scan)+' · watching '+f.watching+' prices';
  FEED=f;$('unit').replaceChildren();$('unit').append((SET.bank?'Your bankroll ':'Bankroll ')+money(myBank())+', 1 unit = '+money(unitSize())+(SET.model==='kelly'?' (¼ Kelly on)':'')+'  ');{const sb=el('button','setbtn','Settings');sb.onclick=()=>{const s=$('settings');s.hidden=!s.hidden};$('unit').append(sb)}
  const rec=f.record||{};const T=$('tiles');T.replaceChildren();
  let u=0,w=0,l=0;['best','lean','parlay'].forEach(k=>{const r=rec[k];if(r){u+=r.units;w+=r.won;l+=r.lost}});
  {const hb=stats((f.history||[]).filter(r=>r.type==='best'));T.append(tile('Best bets profit',money(hb.units*f.unit),hb.w+'–'+hb.l+', '+sgn(hb.units)+'u (the real record)',hb.units>0?'pos':hb.units<0?'neg':''))}
  {const hl=stats((f.history||[]).filter(r=>r.type==='lean'));T.append(tile('Action plays (leans)',hl.w+'–'+hl.l,sgn(hl.units)+'u, tracked separately'))}
  T.append(tile('All picks',w+'–'+l,sgn(u)+'u overall'));
  {const hs=stats(f.history||[]);T.append(tile('Closing-line value',fmtPct(hs.clv),hs.clvn?Math.round(hs.beat*100)+'% beat the close ('+hs.clvn+')':'needs graded picks',hs.clv>0?'pos':hs.clv<0?'neg':''))}

  const picks=f.picks||[];
  const G={};SPORTS.forEach(s=>G[s.id]={picks:[],parlays:[]});
  picks.forEach(p=>G[group(p.sport)].picks.push(p));
  (f.parlays||[]).forEach(p=>G[group(p.label)].parlays.push(p));
  SPORTS.forEach(s=>G[s.id].games=[]);(f.games||[]).forEach(g=>G[group(g.sport)].games.push(g));
  window._BIG=f.big_parlays||[];HIST=f.history||[];UNITV=f.unit||5;FEED=f;settingsPanel();
  window._G=G;render();
  const rb=$('recent');rb.replaceChildren();(f.recent||[]).forEach(r=>{const tr=el('tr');const d=new Date(r.start);
    [d.toLocaleDateString([], {month:'short',day:'numeric'}),r.pick+' ('+r.sport+')',r.tier,r.odds.toFixed(2),r.units+'u'].forEach((x,i)=>{const td=el('td',i>=3?'r':null,x);tr.append(td)});
    const td=el('td','r');td.append(el('span','badge '+(r.status==='won'?'won':r.status==='lost'?'lost':''),r.status.toUpperCase()));tr.append(td);rb.append(tr)});
  if(!(f.recent||[]).length){const tr=el('tr');const td=el('td',null,'No graded picks yet.');td.colSpan=6;tr.append(td);rb.append(tr)}
  const ru=$('rules');ru.replaceChildren();Object.entries(f.rules||{}).sort((a,b)=>b[1].n-a[1].n).forEach(([k,v])=>{const tr=el('tr');
    tr.append(el('td',null,k.replace('americanfootball','football').replace('icehockey','hockey')),el('td','r',v.n),el('td','r '+(v.roi>0?'pos':'neg'),pct(v.roi)),el('td','r',v.clv==null?'—':pct(v.clv)));
    const td=el('td','r');td.append(el('span','badge '+(v.on?'won':'lost'),v.on?'ON':'OFF'));tr.append(td);ru.append(tr)});
}
load();setInterval(autoLoad,120000);
</script>
